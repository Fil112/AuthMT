name: AuthMT
version: 1.1.1
main: mt.auth.AuthMT
api-version: '1.16'

commands:
  login:
    description: Авторизация на сервере
    usage: /login <пароль>
    aliases: [l, log]
  register:
    description: Регистрация на сервере
    usage: /register <пароль> <повтор_пароля>
    aliases: [reg]
  amt:
    description: Управление плагином AuthMT
    usage: /amt reload
    permission: op