# ========================================== #
#            Настройки AuthMT                #
# ========================================== #

# Тип базы данных для хранения паролей
# Варианты:
# sqlite - локальный файл database.db
# mysql  - удаленная база данных
# file   - локальный файл players.yml
storage-type: "sqlite"

# ========================================== #
#            Настройки MySQL                 #
# ========================================== #
# Заполните эти данные, если выбрали storage-type: "mysql"
mysql:
  host: "localhost"
  port: 3306
  database: "authmt_db"
  username: "root"
  password: "password"

# ========================================== #
#             Игровой процесс                #
# ========================================== #
# Название мира-лобби (пустоты), куда телепортируются неавторизованные игроки
auth-world: "auth"

# Время сессии в минутах
session-timeout-minutes: 30

# ========================================== #
#               Сообщения                    #
# ========================================== #
# Поддерживаются стандартные цветовые коды Bukkit через символ '&'
messages:
  welcome: "&eДобро пожаловать! Пожалуйста, используйте &b/login <пароль> &eили &b/register <пароль> <пароль>&e."
  welcome-back: "&aС возвращением! Ваша сессия успешно восстановлена."
  login-success: "&aВы успешно авторизовались!"
  register-success: "&aВы успешно зарегистрировались и вошли в игру!"
  already-logged: "&eВы уже авторизованы!"
  already-registered: "&cВы уже зарегистрированы! Используйте /login <пароль>"
  not-registered: "&cВы не зарегистрированы! Используйте /register <пароль> <повтор_пароля>"
  wrong-password: "&4Неверный пароль!"
  passwords-not-match: "&cПароли не совпадают! Попробуйте еще раз."
  only-players: "&cЭта команда доступна только игрокам!"
  chat-blocked: "&cВы не можете писать в чат до авторизации!"
  cmd-blocked: "&cСначала авторизуйтесь с помощью /login или /register!"